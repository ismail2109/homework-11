<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашнее задание №11</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Мой сайт</h1>
        <p>Домашнее задание №11</p> 
    </header>

    <main class="main">
        <section class="welcome">
            <h2>Добро пожаловать!</h2>
            <p>Зарегистрируйтесь или подпишитесь на нашу рассылку.</p>
            <button type="button" id="open-modal" class="button">
                Регистрация
            </button>
        </section>
    </main>

    <footer class="footer">
        <nav class="footer-nav" aria-label="Навигация в подвале">
            <a href="#home">Главная</a>
            <a href="#about">О нас</a>
            <a href="#contacts">Контакты</a>
        </nav>

        <form id="subscribe-form" class="subscribe-form">
            <label for="email">Подпишитесь на рассылку</label>

            <div class="subscribe-controls">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Введите ваш email"
                    autocomplete="email"
                    required
                >
                <button type="submit" class="button">
                    Подписаться
                </button>
            </div>
        </form>

        <p class="copyright">© 2026. Учебный проект.</p>
    </footer>

    <!-- Затемняющий фон -->
    <div class="overlay" id="overlay"></div>

    <!-- Модальное окно регистрации -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button
                type="button"
                class="close-modal"
                id="close-modal"
                aria-label="Закрыть окно"
            >&times;</button>

            <h2>Регистрация</h2>

            <form id="registration-form">
                <label for="first-name">Имя</label>
                <input
                    type="text"
                    id="first-name"
                    name="firstName"
                    placeholder="Введите имя"
                    autocomplete="given-name"
                    required
                    minlength="2"
                >

                <label for="last-name">Фамилия</label>
                <input
                    type="text"
                    id="last-name"
                    name="lastName"
                    placeholder="Введите фамилию"
                    autocomplete="family-name"
                    required
                    minlength="2"
                >

                <label for="birth-date">Дата рождения</label>
                <input
                    type="date"
                    id="birth-date"
                    name="birthDate"
                    autocomplete="bday"
                    required
                > 

                <label for="login">Логин</label>
                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Придумайте логин"
                    autocomplete="username"
                    required
                    minlength="3"
                >

                <label for="password">Пароль</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Придумайте пароль"
                    autocomplete="new-password"
                    required
                    minlength="6"
                >

                <label for="confirm-password">Повторите пароль</label>
               <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    placeholder="Повторите пароль"
                    autocomplete="new-password"
                    required
                    minlength="6"
                >

                <button type="submit" class="button register-button">
                    Зарегистрироваться
                </button>
            </form>
        </div>
    </div>
</body>
</html>
